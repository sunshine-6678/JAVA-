<!DOCTYPE html>
<html>
<head>
    <title>Largest Number</title>
</head>
<body>

<h2>Largest of Two Numbers</h2>

<script>
function largest(num1, num2) {
    if (num1 > num2) {
        return num1;
    } else {
        return num2;
    }
}

let a = 20;
let b = 15;

document.write("Largest Number = " + largest(a, b));
</script>

</body>
</html>
