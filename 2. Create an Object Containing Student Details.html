<!DOCTYPE html>
<html>
<head>
    <title>Student Object</title>
</head>
<body>

<h2>Student Details</h2>

<script>
let student = {
    name: "Rahul",
    age: 20,
    course: "BCA",
    city: "Mumbai"
};

document.write("Name: " + student.name + "<br>");
document.write("Age: " + student.age + "<br>");
document.write("Course: " + student.course + "<br>");
document.write("City: " + student.city);
</script>

</body>
</html>
